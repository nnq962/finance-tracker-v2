services:
  reminders:
    build: .
    image: finance-backend:local
    user: "${BACKEND_UID:-10001}:${BACKEND_GID:-10001}"
    command: ["finance-backend", "reminders"]
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-finance-tracker-6329d}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
    volumes:
      - type: bind
        source: ${FIREBASE_CREDENTIALS_FILE:?Set the absolute path to the Firebase credentials JSON}
        target: /run/secrets/firebase-admin.json
        read_only: true
    healthcheck:
      disable: true
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
