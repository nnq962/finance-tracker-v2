[project]
name = "finance-backend"
version = "0.1.0"
description = "Background workers for Finance Tracker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "firebase-admin>=7.7.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
finance-backend = "finance_backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
