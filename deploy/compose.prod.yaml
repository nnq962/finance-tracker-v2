# Production app services, layered on compose.yaml by deploy/scripts/deploy.sh.
# Only the Cloudflare Tunnel reaches them from outside; the web port is bound
# to 127.0.0.1 for checks on this machine.

services:
  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?Set the Firebase web config}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?Set the Firebase web config}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?Set the Firebase web config}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
        # Set by deploy.sh to the commit being built.
        NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-}
    image: finance-web
    environment:
      DATABASE_URL: postgres://finance_app:${APP_DB_PASSWORD}@postgres:5432/finance
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      # The AI assistant's model, the one deploy.sh pulls.
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
    volumes:
      - type: bind
        source: ${FIREBASE_CREDENTIALS_FILE:?Set the absolute path to the Firebase Admin credentials JSON}
        target: /run/secrets/firebase-admin.json
        read_only: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      # Image optimisation cache; everything else in the image is read-only.
      - /app/.next/cache:uid=1000,gid=1000
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Daily reminders: every 10 minutes, sends due reminders through FCM.
  worker:
    build:
      context: ../backend
    image: finance-backend
    command: ["finance-backend", "reminders"]
    # The credentials file is readable only by its owner on the host.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATABASE_URL: postgres://finance_app:${APP_DB_PASSWORD}@postgres:5432/finance
      GOOGLE_CLOUD_PROJECT: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
    volumes:
      - type: bind
        source: ${FIREBASE_CREDENTIALS_FILE}
        target: /run/secrets/firebase-admin.json
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s

  # Local LLM for AI transaction entry. No published port: only services on
  # the compose network reach it, at http://ollama:11434. One model stays
  # loaded on the GPU (about 5GB of VRAM with a 4k context).
  ollama:
    image: ollama/ollama:0.35.0
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Publishes the web service through Cloudflare. Enabled when
  # CLOUDFLARE_TUNNEL_TOKEN is set (see deploy.sh); the tunnel's public
  # hostname points to http://web:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]


volumes:
  # Downloaded models; created outside compose so a `down -v` keeps them.
  ollama:
    external: true
    name: finance-ollama
