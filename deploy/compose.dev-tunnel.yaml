# The dev tunnel: https://finance-dev.nnqlab.dev → the dev server on this
# machine (npm run dev, port 3000), always on: Docker restarts it, also after
# a reboot. Started and stopped by deploy/scripts/dev-tunnel.sh.
name: finance-dev-tunnel

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    # The tunnel `finance-dev` by id, so only its credentials file is needed.
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --url
      - http://localhost:3000
      - --credentials-file
      - /etc/cloudflared/finance-dev.json
      - efd91426-ed7b-4f53-a0e7-a413b5d21bee
    # localhost is this machine, where the dev server listens.
    network_mode: host
    # The credentials file is readable by its owner only.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    volumes:
      - ${HOME}/.cloudflared/efd91426-ed7b-4f53-a0e7-a413b5d21bee.json:/etc/cloudflared/finance-dev.json:ro
    restart: unless-stopped
