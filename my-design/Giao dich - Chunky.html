<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giao dịch</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfaf7; --card:#fff; --ink:#2b2a33; --muted:#8f8b98; --line:#e7e4dd; --line-d:#d9d5cc;
  --leaf:oklch(0.76 0.19 138);  --leaf-d:oklch(0.60 0.17 140);  --leaf-t:oklch(0.95 0.06 138);
  --sky:oklch(0.74 0.14 235);   --sky-d:oklch(0.58 0.14 240);   --sky-t:oklch(0.95 0.04 235);
  --sun:oklch(0.85 0.16 85);    --sun-d:oklch(0.70 0.15 70);    --sun-t:oklch(0.96 0.06 85);
  --coral:oklch(0.70 0.19 25);  --coral-d:oklch(0.56 0.18 25);  --coral-t:oklch(0.95 0.04 25);
  --grape:oklch(0.66 0.17 300); --grape-d:oklch(0.52 0.17 300); --grape-t:oklch(0.95 0.04 300);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:700;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.disp{font-family:'Baloo 2',sans-serif}
.page{max-width:1040px;margin:0 auto;padding:20px 28px 80px}

/* ---- chunky primitives ---- */
.btn{
  --face:var(--leaf);--shade:var(--leaf-d);--text:#fff;--edge:5px;
  border:0;cursor:pointer;user-select:none;background:var(--face);color:var(--text);
  font:800 15px/1 'Baloo 2';letter-spacing:.06em;text-transform:uppercase;
  padding:13px 22px 11px;border-radius:14px;box-shadow:0 var(--edge) 0 var(--shade);
  display:inline-flex;align-items:center;gap:8px;margin-bottom:var(--edge);
  transition:transform .08s, box-shadow .08s, filter .15s;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(var(--edge));box-shadow:0 0 0 var(--shade)}
.btn.outline{--face:#fff;--shade:var(--line);--text:var(--muted);border:2px solid var(--line);padding:11px 16px 9px}
.btn.sq{width:44px;height:44px;padding:0;justify-content:center;font-size:18px;letter-spacing:0;--edge:4px;border-radius:12px}
.btn.sm{--edge:4px;font-size:13px;padding:10px 14px 8px;border-radius:12px}
.btn.sel{--face:var(--sky-t);--shade:oklch(0.80 0.09 235);--text:var(--sky-d);border-color:oklch(0.80 0.09 235)}
.plus{font-size:20px;line-height:0;margin-top:-2px}

.card{background:var(--card);border:2px solid var(--line);border-radius:20px}

/* ---- top bar ---- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.crumb{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px}
.crumb .btn{margin-bottom:4px}
.crumb b{color:var(--ink)}
.side-ico{width:16px;height:14px;border:2.5px solid currentColor;border-radius:4px;position:relative}
.side-ico::after{content:"";position:absolute;left:3px;top:0;bottom:0;border-left:2.5px solid currentColor}
.sun-ico{width:14px;height:14px;border-radius:50%;background:var(--sun-d);box-shadow:0 0 0 3px var(--sun-t)}

/* ---- header ---- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:26px;border-bottom:2px solid var(--line);margin-bottom:26px}
h1{font:800 40px/1 'Baloo 2';margin:0 0 6px}
.sub{color:var(--muted);font-size:16px;margin:0}

/* ---- stats ---- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:28px}
.stat{padding:18px 20px 16px;display:flex;flex-direction:column}
.stat-top{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 4px;border-radius:99px;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.pill.in{background:var(--leaf-t);color:var(--leaf-d)}
.pill.out{background:var(--coral-t);color:var(--coral-d)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.muted{color:var(--muted)}
.amount{font:800 40px/1 'Baloo 2';margin:22px 0 18px}
.amount.in{color:var(--leaf-d)} .amount.out{color:var(--coral-d)}
.stat-foot{border-top:2px dashed var(--line);padding-top:12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.top-cat{display:flex;align-items:center;gap:12px;margin:16px 0 14px}
.cat-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:800 20px 'Baloo 2';flex:none}
.cat-ico.grape{background:var(--grape-t);color:var(--grape-d)}
.top-cat .n{font-size:16px}
.top-cat .v{color:var(--coral-d);font-size:14px}
.pct{margin-left:auto;font:800 34px/1 'Baloo 2';color:var(--grape-d)}
.prog{height:16px;border-radius:99px;background:var(--line);position:relative;overflow:hidden;margin-bottom:14px}
.prog b{position:absolute;inset:0 auto 0 0;width:38%;background:var(--grape);border-radius:99px}
.prog b::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}

/* ---- toolbar ---- */
.tools{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.tabs,.nav{display:flex;gap:10px;align-items:center}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:5px}
.seg button{border:0;background:transparent;font:800 13px/1 'Baloo 2';letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px 8px;border-radius:10px;cursor:pointer}
.seg button.on{background:#fff;color:var(--sky-d);box-shadow:0 3px 0 var(--line-d)}
.month{font:800 15px/1 'Baloo 2';padding:0 8px;min-width:130px;text-align:center}
.count{margin:14px 0 22px;font-size:15px;padding-bottom:20px;border-bottom:2px solid var(--line)}
.count span{color:var(--muted)}

/* ---- timeline ---- */
.day{position:relative;padding-left:38px;margin-bottom:26px}
.day::before{content:"";position:absolute;left:11px;top:22px;bottom:-30px;border-left:3px dashed var(--line-d)}
.day:last-child::before{display:none}
.node{position:absolute;left:0;top:2px;width:25px;height:25px;border-radius:50%;background:#fff;border:3px solid var(--line-d)}
.day.today .node{border-color:var(--sun-d);background:var(--sun)}
.day-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-top:3px}
.day-h .d{font:800 15px 'Baloo 2';letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.day-h .t{font:800 15px 'Baloo 2'}
.list{overflow:hidden}
.tx{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;transition:background .15s}
.tx+.tx{border-top:2px solid var(--line)}
.tx:hover{background:#faf8f3}
.arrow{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font:800 22px/1 'Nunito';flex:none}
.arrow.out{background:var(--coral-t);color:var(--coral-d)}
.arrow.in{background:var(--leaf-t);color:var(--leaf-d)}
.tx .name{font-size:16px;font-weight:800}
.tx .meta{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center}
.chip{padding:2px 8px 1px;border-radius:7px;font-size:12px;font-weight:800}
.tx .r{margin-left:auto;text-align:right}
.tx .amt{font:800 18px/1 'Baloo 2'}
.tx .amt.out{color:var(--coral-d)} .tx .amt.in{color:var(--leaf-d)}
.tx .time{font-size:13px;color:var(--muted);margin-top:4px}
.empty{text-align:center;padding:40px;color:var(--muted)}
.t-out{color:var(--coral-d)} .t-in{color:var(--leaf-d)}

@media(max-width:820px){.stats{grid-template-columns:1fr}.head{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="page" data-screen-label="Giao dịch">

  <div class="top">
    <div class="crumb">
      <button class="btn outline sq" aria-label="Thu gọn thanh bên"><span class="side-ico"></span></button>
      <b>Giao dịch</b>
    </div>
    <button class="btn outline sq" aria-label="Giao diện"><span class="sun-ico"></span></button>
  </div>

  <div class="head">
    <div>
      <h1>Giao dịch</h1>
      <p class="sub">Theo dõi các khoản thu, chi và chuyển khoản của bạn.</p>
    </div>
    <button class="btn"><span class="plus">+</span> Thêm giao dịch</button>
  </div>

  <div class="stats">
    <div class="card stat">
      <div class="stat-top"><span class="pill in"><i></i>Đã thu</span><span class="muted">Chưa có tháng trước</span></div>
      <div class="amount in">500.000đ</div>
      <div class="stat-foot"><span>1 giao dịch</span></div>
    </div>
    <div class="card stat">
      <div class="stat-top"><span class="pill out"><i></i>Đã chi</span><span class="muted">Chưa có tháng trước</span></div>
      <div class="amount out">611.000đ</div>
      <div class="stat-foot"><span>8 giao dịch</span></div>
    </div>
    <div class="card stat">
      <div class="stat-top"><span>Chi nhiều nhất tháng này</span></div>
      <div class="top-cat">
        <div class="cat-ico grape">@</div>
        <div><div class="n">Mạng xã hội</div><div class="v">231.000đ</div></div>
        <div class="pct">38%</div>
      </div>
      <div class="prog"><b></b></div>
      <div class="stat-foot"><span>1 giao dịch</span><span>TB 231.000đ</span></div>
    </div>
  </div>

  <div class="tools">
    <div class="tabs" id="tabs">
      <button class="btn outline sm" data-f="all">Tất cả</button>
      <button class="btn outline sm sel" data-f="out">Chi tiền</button>
      <button class="btn outline sm" data-f="in">Thu tiền</button>
      <button class="btn outline sm" data-f="transfer">Chuyển khoản</button>
    </div>
    <div class="nav">
      <div class="seg" id="seg"><button>Tuần</button><button class="on">Tháng</button></div>
      <button class="btn outline sq" aria-label="Tháng trước">‹</button>
      <div class="month">Tháng 09, 2026</div>
      <button class="btn outline sq" aria-label="Tháng sau">›</button>
      <button class="btn outline sq" aria-label="Tìm kiếm" style="font-size:16px">⌕</button>
      <button class="btn outline sq" aria-label="Làm mới" style="font-size:17px">↻</button>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div id="timeline"></div>
</div>

<script>
const CAT = {
  'Ăn uống':{c:'sun'}, 'Vay & nợ':{c:'sky'}, 'Mạng xã hội':{c:'grape'}, 'Đi lại':{c:'leaf'}, 'Thu nhập':{c:'leaf'}
};
const DATA = [
  {day:'Thứ Bảy, 26/09', today:true, items:[
    {n:'Ăn tối',c:'Ăn uống',w:'Ví momo',a:50000,t:'18:58',k:'out'},
    {n:'Ăn trưa',c:'Ăn uống',w:'Ví momo',a:30000,t:'13:12',k:'out'},
    {n:'Ăn sáng',c:'Ăn uống',w:'Ví momo',a:25000,t:'08:12',k:'out'}]},
  {day:'Thứ Sáu, 25/09', items:[
    {n:'Cho vay · Tâm',c:'Vay & nợ',w:'Ví momo',a:200000,t:'00:00',k:'out'}]},
  {day:'Thứ Năm, 24/09', items:[
    {n:'Quảng cáo Facebook',c:'Mạng xã hội',w:'Ví momo',a:231000,t:'21:40',k:'out'},
    {n:'Cà phê sáng',c:'Ăn uống',w:'Ví momo',a:35000,t:'09:05',k:'out'},
    {n:'Trà sữa',c:'Ăn uống',w:'Ví momo',a:30000,t:'15:20',k:'out'},
    {n:'Gửi xe',c:'Đi lại',w:'Tiền mặt',a:10000,t:'08:30',k:'out'}]},
  {day:'Chủ Nhật, 20/09', items:[
    {n:'Lương part-time',c:'Thu nhập',w:'Ví momo',a:500000,t:'10:00',k:'in'}]},
];
const fmt = n => n.toLocaleString('vi-VN') + 'đ';
let filter = 'out';

function render(){
  const tl = document.getElementById('timeline');
  let total = 0, html = '';
  DATA.forEach(g=>{
    const items = g.items.filter(i=>filter==='all'||i.k===filter);
    if(!items.length) return;
    total += items.length;
    const out = items.filter(i=>i.k==='out').reduce((s,i)=>s+i.a,0);
    const inn = items.filter(i=>i.k==='in').reduce((s,i)=>s+i.a,0);
    const sum = [inn?`<span class="t-in">+${fmt(inn)}</span>`:'', out?`<span class="t-out">${fmt(out)}</span>`:''].filter(Boolean).join(' · ');
    html += `<div class="day ${g.today?'today':''}"><span class="node"></span>
      <div class="day-h"><span class="d">${g.day}</span><span class="t">${sum}</span></div>
      <div class="card list">${items.map(i=>{
        const col = CAT[i.c].c;
        return `<div class="tx">
          <div class="arrow ${i.k}">${i.k==='out'?'↗':'↙'}</div>
          <div><div class="name">${i.n}</div>
            <div class="meta"><span class="chip" style="background:var(--${col}-t);color:var(--${col}-d)">${i.c}</span>${i.w}</div></div>
          <div class="r"><div class="amt ${i.k}">${i.k==='in'?'+':''}${fmt(i.a)}</div><div class="time">${i.t}</div></div>
        </div>`}).join('')}</div></div>`;
  });
  tl.innerHTML = html || '<div class="card empty">Chưa có giao dịch nào ở mục này.</div>';
  document.getElementById('count').innerHTML = `${total} giao dịch <span>· tháng này</span>`;
}
document.querySelectorAll('#tabs .btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs .btn').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); filter=b.dataset.f; render();
});
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
});
render();
</script>
</body>
</html>
